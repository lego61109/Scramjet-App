<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Nebula Browser</title>

		<link rel="icon" href="favicon.webp" />

		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>

		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<!-- Loading screen -->
		<div id="neb-loader">
			<div class="neb-orbit">
				<div class="neb-ring"></div>
				<div class="neb-ring neb-ring-2"></div>
				<div class="neb-core"></div>
			</div>
			<h1 class="neb-title">Nebula Browser</h1>
			<p class="neb-sub">Entering the cosmos...</p>
		</div>

		<!-- Animated star layers -->
		<div class="stars stars-1"></div>
		<div class="stars stars-2"></div>
		<div class="stars stars-3"></div>

		<main class="neb-main">
			<div title="Nebula Browser" class="flex-center logo-wrapper header-center">
				<div class="neb-logo"></div>
				<h1 class="neb-heading">Nebula Browser</h1>
			</div>

			<div class="flex-center desc">
				<p>Explore the web beyond the stars. Fast, free, and unbound.</p>
			</div>

			<form id="sj-form" class="flex-center">
				<input
					id="sj-search-engine"
					value="https://www.google.com/search?q=%s"
					type="hidden"
				/>
				<input
					id="sj-address"
					type="text"
					placeholder="Search the cosmos or enter a URL"
					autocomplete="off"
					spellcheck="false"
				/>
			</form>

			<div class="desc">
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</div>
		</main>

		<footer>
			<div>
				<a title="Source code" href="https://github.com/lego61109/Scramjet-App"
					>GitHub</a
				>
				<a title="License information" href="credits.html">Credits</a>
			</div>
			<div>
				<span>Nebula Browser &middot; Powered by Scramjet</span>
			</div>
		</footer>

		<script>
			// Hide the loading screen once everything has loaded
			window.addEventListener("load", () => {
				setTimeout(() => {
					const loader = document.getElementById("neb-loader");
					if (!loader) return;
					loader.classList.add("neb-hide");
					setTimeout(() => loader.remove(), 900);
				}, 2000);
			});
		</script>
	</body>
</html>
